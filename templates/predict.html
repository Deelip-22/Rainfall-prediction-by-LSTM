<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Forecast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .header {
            background-color: #007BFF;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        .forecast-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 250px;
            height: 200px;
            border-radius: 10px;
            margin: 15px;
            padding: 20px;
            background: linear-gradient(45deg, #ffffff, #f0f0f0);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .result-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        .result-box img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        p {
            margin: 5px 0;
            font-size: 16px;
            color: #555;
        }
        h1 {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Rainfall Forecast</h1>
    </div>
    <div class="forecast-container">
        {% for item in forecast %}
        <div class="result-box">
            <p>{{ item.Date.strftime('%Y-%m-%d') }}</p>
            <p>{{ item.Day }}</p>
            {% if item.Rainfall_Predicted == 1 %}
            <img src="{{ url_for('static', filename='rainfall.jpg') }}" alt="Rainy">
            <p>Rain</p>
            {% else %}
            <img src="{{ url_for('static', filename='norain.png') }}" alt="Sunny">
            <p>No Rain</p>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</body>
</html>
