<!DOCTYPE html>
<html>
<head>
    <title>Tribhuvan International Airport</title>
    <style>
        /* CSS for background image */
        body {
            background-image: url('https://rpcdn.ratopati.com/media/albums/TIA_nyUdp0ATPW.jpg'); /* Replace 'tribhuvan_airport.jpg' with the path to your image */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        /* CSS for overlay */
        .overlay {
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black overlay */
            padding: 50px;
            text-align: center;
        }

        /* CSS for heading */
        h1 {
            font-size: 36px;
        }

        /* CSS for description */
        p {
            font-size: 18px;
        }

        /* CSS for menu */
        .menu {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }

        /* CSS for menu links */
        .menu a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        /* CSS for menu links on hover */
        .menu a:hover {
            background-color: #ddd;
            color: black;
        }

        /* CSS for active/current menu link */
        .menu a.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>

<div class="menu">
    <a class="active" href="#home">Home</a>
    <!-- Predict option styled as a link -->
    <a href="/predict">Predict</a>
</div>

<div class="overlay">
    <h1>Welcome to Tribhuvan International Airport</h1>
    <p>Tribhuvan International Airport (TIA) is the only international airport in Nepal and is located in Kathmandu, the capital city. It serves as the main gateway to Nepal for tourists and travelers.</p>
</div>

</body>
</html>
